services:
  # Backend Web Service
  - type: web
    name: ticketharbor-backend
    env: node
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: SUPER_ADMIN_NAME
        value: "TicketHarbour Super Admin"
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

  # Frontend Static Site
  - type: web
    name: ticketharbor-frontend
    env: static
    rootDir: .
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
